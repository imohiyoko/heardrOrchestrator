# 人の承認が要るかどうか(操作ごと)。1 行 1 ルール: <操作のパターン> = ask|allow
#   ask   = 人の承認が要る(既定)
#   allow = 承認なしで進めてよい(人が「今後は許可」と言ったもの)
# パターンは glob(* と ?)。上から順に見て最初に一致した行で決まる。どれにも一致しなければ ask。
# 書き換えるのは人だけ: tb allow <操作> / tb ask <操作>(agent の pane からは実行できない)。手で編集してもよい。
#
# 操作の名前:
#   send:<kind>:<宛先>     tb send(kind は task|info|answer)。ask なら outbox で人の承認待ちになり、tb approve O-<n> で届く
#   role:change            人事エージェントが roles/ を書き換える
#   proxy:<effect>         代行依頼(read-only|write|external)。read-only は proxy-check の allow 判定も必要
#   setup:<step>           セットアップ agent の書き込み(hooks|scheduler|webui|launchctl など)
#   alert:analyze          アラートが登録されたとき解析役の agent を起動する(同時に動かす数は TB_ANALYST_MAX、既定 2)
send:info:*   = allow
send:answer:* = allow
send:task:*   = ask
role:change   = ask
proxy:read-only = allow
alert:analyze = allow
* = ask
